services:
  - type: web
    name: pc-cheak-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: SESSION_TTL_HOURS
        value: 12
      - key: COOKIE_SECURE
        value: true
      - key: CORS_ORIGINS
        value: https://pc-cheak.gt.tc
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
